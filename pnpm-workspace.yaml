packages:
  - "packages/*"
allowBuilds:
  esbuild: true
overrides:
  esbuild: 0.28.1
  undici: ^6.28.0
  # GHSA-rgw5-rvv9-x895: brace-expansion DoS, bypassing the earlier
  # CVE-2026-14257 mitigation that ^5.0.8 was pinned for. Reached only through
  # eslint's transitive minimatch.
  brace-expansion: ^5.0.9
  # GHSA-7p8r-x3mc-p8w7: fast-uri authority-introducer parsing. Reached through
  # @modelcontextprotocol/sdk > ajv, which needs the 3.x line, so this stays on
  # ^3 rather than following fast-uri to 4.x.
  fast-uri: ^3.1.5
  # GHSA-fxqj-rqcc-2cmp: postcss reads arbitrary .map files from an
  # attacker-controlled sourceMappingURL when `from` is unset. Build tooling
  # only, through tsup and vitest.
  postcss: ^8.5.23
  # GHSA-8j4g-w8fx-2239: hono ReDoS in the CORS middleware. Reached through
  # @modelcontextprotocol/sdk, so this one is on the runtime path of the
  # published mergewarden-mcp package, not just the build.
  hono: ^4.12.34
  # GHSA-5p4m-2wfm-xmqj: js-yaml quadratic CPU in !!omap resolution.
  js-yaml: ^4.3.1
  # GHSA-2v37-7h3g-55p8: nanoid custom generators can loop indefinitely.
  nanoid: ^3.3.17
