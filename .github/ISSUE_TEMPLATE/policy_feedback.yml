name: Scan feedback
description: Share whether a real MergeWarden result helped you review a PR
title: "[Scan feedback] "
labels:
  - question
body:
  - type: textarea
    id: pull_request
    attributes:
      label: Public pull request
      description: Link the public PR you scanned when you can share it.
      placeholder: https://github.com/owner/repository/pull/123
  - type: textarea
    id: result
    attributes:
      label: Result and file
      description: Which finding was useful, missing, or wrong and which file did it point to?
      placeholder: The workflow permission finding in .github/workflows/release.yml helped us catch an unnecessary write permission.
    validations:
      required: true
  - type: dropdown
    id: usefulness
    attributes:
      label: Was the result useful
      options:
        - "Yes"
        - Partly
        - "No"
        - The scan did not finish
    validations:
      required: true
  - type: textarea
    id: review_action
    attributes:
      label: What happened next
      description: Did you change the PR, dismiss the finding, or decide not to install the Action?
  - type: textarea
    id: friction
    attributes:
      label: Scan or installation friction
      description: What made the scanner, CLI fallback, or Action installation harder than expected?
