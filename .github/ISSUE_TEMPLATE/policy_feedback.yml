name: Result feedback
description: Share what a review queue or PR scan changed in your actual review
title: "[Result feedback] "
labels:
  - question
body:
  - type: textarea
    id: pull_request
    attributes:
      label: Public repository or pull request
      description: Link the target or shared result when you can share it. Do not include tokens or private code.
      placeholder: https://github.com/owner/repository/pull/123
  - type: textarea
    id: result
    attributes:
      label: Result and evidence
      description: Which queue note or finding was useful, missing, or wrong? Identify the PR or file.
      placeholder: The workflow permission finding in .github/workflows/release.yml helped us catch an unnecessary write permission.
    validations:
      required: true
  - type: dropdown
    id: usefulness
    attributes:
      label: Was the result useful
      options:
        - "Yes"
        - Partly
        - "No"
        - The scan did not finish
    validations:
      required: true
  - type: textarea
    id: review_action
    attributes:
      label: What happened next
      description: What would you have done without this result? Did it change which PR you opened, a review decision, or the time you spent?
  - type: textarea
    id: friction
    attributes:
      label: Scan or installation friction
      description: What made using or returning to the queue, scanner, CLI, or Action harder than expected? What do you use instead?
